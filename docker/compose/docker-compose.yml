
services:
  webapi:
    build:
      context: ../../
      dockerfile: ExpenseTrackerApp/src/ExpenseTrackerApp.WebApi/Dockerfile
    restart: unless-stopped
    container_name: expensetrackerapp.webapi
    ports:
      - "8080:8080"
    environment:
      Database__ConnectionString: "${CONNECTION_STRING}"
      Jwt__Key: "${JWT_KEY}"
